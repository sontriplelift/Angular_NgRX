<div class="app-custom-value">
  <div class="toggle-btn-container">
    <button class="toggle-btn" (click)="onToogleCustomInput()">{{showCustomInput ? '-' : '+'}}</button>
  </div>

  <div class="custom-input-container" *ngIf="showCustomInput">
    <input type="text" [(ngModel)]="customValue" />
    <button class="btn-increment-by" (click)="onCustomIncrement()">
      Increment By
    </button>
  </div>
</div>
